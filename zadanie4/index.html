<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Zadania jquery</title>
    <script>
$(function () {
    // Dodanie na koniec
    $("#naKoniec").click(function () {
        let napis = $("#produkt").val().trim(); 
        if (napis.length > 0) {
            $("#lista").append('<li>' + napis + '</li>');
            $("li").last().css({
                "color": "blue",
                "font-weight": "bold"
            });
        }
        $("#produkt").val(""); 
    });

    // Dodanie na początek
    $("#naPoczatek").click(function () {
        let napis = $("#produkt").val().trim();
        if (napis.length > 0) {
            $("#lista").prepend('<li>' + napis + '</li>');
            $("li").first().css("color", "green");
        }
        $("#produkt").val("");
    });

    // Włączanie/wyłączanie przycisku
    $("#accept").click(function () {
        if (this.checked) {
            $("#fdfd").removeAttr("disabled");
        } else {
            $("#fdfd").attr("disabled", "disabled");
        }
    });
});




    </script>
   <style>

   </style>
</head>
<body>
<ul id="lista">
  <li>Chleb</li>
  <li>Mleko</li>
</ul>
<input type="text" id="produkt" placeholder="Nazwa produktu">
<button id="naKoniec">Dodaj na koniec</button>
<button id="naPoczatek">Dodaj na początek</button>

<input type="checkbox" name="accept" id="accept">
<label for="ackeptuje" id="akceptuje">CZY AKCEPTUJESZ?</label>
<button id="fdfd" disabled>Wyslij</button>
</body>
</html>
