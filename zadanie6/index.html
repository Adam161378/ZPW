        <script>
            $(function(){

                //     console.log($(this).attr("data-cena"))  //string
                //     console.log($(this).data("cena"))   //int
                    
                //  })
                 let sum = 0;
                $("#lista li").each(function(index){
                  
                    sum += $(this).data("cena");
                    $("#suma").text("SUMA: " + sum)

                    if($(this).data("cena") > 20){
                    $(this).addClass("drogie")
                }

                if(index % 2 == 0){
                   $(this).css("background-color", "gray")
                }

                if($(this).data("cena") > 20){
                    $(this).css("background-color", "yellow")
                    return false;
                }
                
                })


                
            })
        </script>
