<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>

    <title>Efekty jQuery</title>

    <script>
        $(function () {

            // Ukryj tekst
            $("#ukryj").click(function () {
                $("#tekst").hide();
            });

            // Schowaj kota
            $("#hide").click(function () {
                $("#kocur").hide(2000);
            });

            // Pokaż kota
            $("#show").click(function () {
                $("#kocur").show(2000);
            });

            // Pokaż wiadomość
            $("#pokaz").click(function () {
                $("#sekret").show(2000);
            });

            // Zapisz się
            $("#signUp").click(function () {
                $("#komunikat").show(1000);
            });

            // Pokaż / ukryj opis
            $("#przelacz").click(function () {
                $("#opis").toggle();
            });

            // Pokaż / ukryj podpowiedź
            $("#help").click(function () {
                $("#hint").toggle();
            });

            // Kliknięcie książki - schowanie
            $("#book").click(function () {
                $(this).slideUp("slow");
            });

            // Kliknięcie przycisku - pokazanie książki
            $("#clickme").click(function () {
                $("#book").slideDown("slow");
            });

            // Kliknięcie przycisku - pokazanie/ukrycie drugiej książki
            $("#clickme1").click(function () {
                $("#book1").slideToggle("slow");
            });

        });
    </script>

    <style>
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 180ms ease;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            color: #FFFFFF;
            background-color: #2563EB;
            border: 0;
        }

        img {
            border-radius: 100px;
        }

        #hint {
            display: none;
        }
    </style>
</head>

<body>

    <p id="tekst">Kliknij, a zniknę</p>
    <button id="ukryj">Ukryj</button>

    <br><br>

    <img src="kot.png" alt="kot" id="kocur">

    <br><br>

    <button id="hide">Schowaj kota</button>

    <br><br>

    <button id="show">Pokaż kota</button>

    <br><br>

    <p id="sekret" style="display: none;">Tajna wiadomość</p>
    <button id="pokaz">Pokaż</button>

    <br><br>

    <p id="komunikat" style="display: none;">
        Dziękujemy za zapisanie się
    </p>

    <button id="signUp">Zapisz się</button>

    <br><br>

    <p id="opis">Opis produktu</p>
    <button id="przelacz">Pokaż/ukryj opis</button>

    <br><br>

    <input type="password" name="pass" id="haslo">
    <button id="help">?</button>
    <span id="hint">Hasło musi zawierać 8 znaków</span>

    <br><br>

    <img id="book" src="book.png" alt="Książka" width="100" height="123">

    <br><br>

    <button id="clickme">Pokaż książkę</button>

    <br><br>

    <img id="book1" src="book.png" alt="Książka" width="100" height="123">

    <br><br>

    <button id="clickme1">Pokaż/ukryj książkę</button>

</body>
</html>
