           <!--
    Kierunek:
    t     – góra
    b     – dół
    e     – prawa strona
    s     – lewa strona
    x     – lewo i prawo
    y     – góra i dół
    brak  – wszystkie strony
-->

<!-- 
    Breakpointy (responsywność):
    skrót | minimalna szerokość ekranu | typowe urządzenie
    ------|---------------------------|-------------------------
    brak  | 0px                       | każde urządzenie
    sm    | 576px                     | duży telefon poziomo
    md    | 768px                     | tablet
    lg    | 992px                     | laptop
    xl    | 1200px                    | monitor
    xxl   | 1400px                    | duży monitor
-->
