```html
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Efekty jQuery</title>

    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: #1d4ed8;
        }

        img {
            border-radius: 100px;
        }

        #hint {
            display: none;
        }
    </style>
</head>

<body>

    <p id="tekst">Kliknij, a zniknę</p>
    <button id="ukryj">Ukryj tekst</button>

    <br><br>

    <img id="kocur" src="kot.png" alt="Kot">

    <br><br>

    <button id="hide">Schowaj kota</button>

    <br><br>

    <button id="show">Pokaż kota</button>

    <br><br>

    <p id="sekret" style="display: none;">
        Tajna wiadomość
    </p>

    <button id="pokaz">Pokaż wiadomość</button>

    <br><br>

    <p id="komunikat" style="display: none;">
        Dziękujemy za zapisanie się!
    </p>

    <button id="signUp">Zapisz się</button>

    <br><br>

    <p id="opis">Opis produktu</p>

    <button id="przelacz">
        Pokaż / ukryj opis
    </button>

    <br><br>

    <input
        type="password"
        id="haslo"
        name="pass"
        placeholder="Hasło"
    >

    <button id="help">?</button>

    <span id="hint">
        Hasło musi zawierać 8 znaków.
    </span>

    <br><br>

    <img
        id="book"
        src="book.png"
        alt="Książka"
        width="100"
        height="123"
    >

    <br><br>

    <button id="clickme">Pokaż książkę</button>

    <br><br>

    <button id="hideBook">Schowaj książkę</button>

    <br><br>

    <img
        id="book1"
        src="book.png"
        alt="Książka"
        width="100"
        height="123"
    >

    <br><br>

    <button id="clickme1">
        Pokaż / ukryj książkę
    </button>

    <script>
        $(document).ready(function () {

            $("#ukryj").click(function () {
                $("#tekst").hide();
            });

            $("#hide").click(function () {
                $("#kocur").hide(2000);
            });

            $("#show").click(function () {
                $("#kocur").show(2000);
            });

            $("#pokaz").click(function () {
                $("#sekret").show(2000);
            });

            $("#signUp").click(function () {
                $("#komunikat").show(1000);
            });

            $("#przelacz").click(function () {
                $("#opis").toggle();
            });

            $("#help").click(function () {
                $("#hint").toggle();
            });

            $("#book").click(function () {
                $(this).slideUp("slow");
            });

            $("#clickme").click(function () {
                $("#book").slideDown("slow");
            });

            $("#hideBook").click(function () {
                $("#book").slideUp("slow");
            });

            $("#clickme1").click(function () {
                $("#book1").slideToggle("slow");
            });

        });
    </script>

</body>

</html>
