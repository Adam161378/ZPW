let positionX = 0
let positionY = 0
            $(document).on("keypress", function(event){
               if (event.key === "d") {
            positionX += 10;
            $("#kwadrat").css("margin-left", positionX + "px");
        }
        if (event.key === "a") {
            positionX -= 10;
            $("#kwadrat").css("margin-left", positionX + "px");
        }
        if (event.key === "s") {
            positionY += 10;
            $("#kwadrat").css("margin-top", positionY + "px");
        }
        if (event.key === "w") {
            positionY -= 10;
            $("#kwadrat").css("margin-top", positionY + "px");
        }

        console.log("Pozycje: " + positionX + positionY)
  })
              
                $("#jablko").css({
                    "margin-left":  Math.floor((Math.random() * 500) + 1),
                    "margin-top":  Math.floor((Math.random() * 500) + 1)
                })
          
            })
    </script>

        width: 200px;
