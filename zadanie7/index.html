<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <title>Gra</title>

    <style>
        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
        }

        #jablko {
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }
    </style>

    <script>
        $(function() {

            let positionX = 0;
            let positionY = 0;

            let jablkoX = Math.floor(Math.random() * 500);
            let jablkoY = Math.floor(Math.random() * 500);

            // Ustawienie jabłka
            $("#jablko").css({
                left: jablkoX + "px",
                top: jablkoY + "px"
            });

            // Ruch kwadratu
            $(document).on("keydown", function(event) {

                if (event.key === "d") {
                    positionX += 10;
                }

                if (event.key === "a") {
                    positionX -= 10;
                }

                if (event.key === "s") {
                    positionY += 10;
                }

                if (event.key === "w") {
                    positionY -= 10;
                }

                // Pozycja kwadratu
                $("#kwadrat").css({
                    left: positionX + "px",
                    top: positionY + "px"
                });

                // KOLIZJA
                if (
                    positionX < jablkoX + 20 &&
                    positionX + 200 > jablkoX &&
                    positionY < jablkoY + 20 &&
                    positionY + 200 > jablkoY
                ) {

                    console.log("KOLIZJA!");

                    // Nowa pozycja jabłka
                    jablkoX = Math.floor(Math.random() * 500);
                    jablkoY = Math.floor(Math.random() * 500);

                    $("#jablko").css({
                        left: jablkoX + "px",
                        top: jablkoY + "px"
                    });
                }

            });
        });
    </script>
</head>

<body>

    <div id="kwadrat"></div>
    <div id="jablko"></div>

</body>
</html>
