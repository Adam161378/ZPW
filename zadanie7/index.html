<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <title>Document</title>

    <script>
        $(function(){

            let positionX = 0;
            let positionY = 0;

            let jablkoX = Math.floor(Math.random() * 500);
            let jablkoY = Math.floor(Math.random() * 500);

            // Ustawienie jabłka
            $("#jablko").css({
                "margin-left": jablkoX + "px",
                "margin-top": jablkoY + "px"
            });

            // Ruch kwadratu
            $(document).on("keydown", function(event){

                if(event.key === "d"){
                    positionX += 10;
                }

                if(event.key === "a"){
                    positionX -= 10;
                }

                if(event.key === "s"){
                    positionY += 10;
                }

                if(event.key === "w"){
                    positionY -= 10;
                }

                $("#kwadrat").css({
                    "margin-left": positionX + "px",
                    "margin-top": positionY + "px"
                });

                // Sprawdzanie kolizji
                if(
                    positionX < jablkoX + 20 &&
                    positionX + 200 > jablkoX &&
                    positionY < jablkoY + 20 &&
                    positionY + 200 > jablkoY
                ){

                    // Nowa pozycja jabłka
                    jablkoX = Math.floor(Math.random() * 500);
                    jablkoY = Math.floor(Math.random() * 500);

                    $("#jablko").css({
                        "margin-left": jablkoX + "px",
                        "margin-top": jablkoY + "px"
                    });
                }

            });

        });
    </script>

    <style>
        #kwadrat {
            width: 200px;
            height: 200px;
            background-color: red;
            position: absolute;
        }

        #jablko {
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }
    </style>
</head>

<body>

    <div id="kwadrat"></div>
    <div id="jablko"></div>

</body>
</html>
