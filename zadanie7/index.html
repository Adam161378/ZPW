<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Document</title>
    <script>
        $(function(){
            // $(document).on("keypress keyup keydown", function(event){
            //     $("#eventType").text(event.type)
            //     })
            //     $(document).on("mousemove", function(event){
            //         $("#pageX").text(event.pageX)
            //          $("#pageY").text(event.pageY)
            //     })

            let positionX = 0;
            let positionY = 0;

            let jablkoX = Math.floor(Math.random() * 500);
            let jablkoY = Math.floor(Math.random() * 500);

         
            $("#jablko").css({
                "margin-left": jablkoX + "px",
                "margin-top": jablkoY + "px"
            });

            $(document).on("keydown", function (event) {

                if (event.key === "d") {
                    positionX += 10;
                }

                if (event.key === "a") {
                    positionX -= 10;
                }

                if (event.key === "s") {
                    positionY += 10;
                }

                if (event.key === "w") {
                    positionY -= 10;
                }

              
                $("#kwadrat").css({
                    "margin-left": positionX + "px",
                    "margin-top": positionY + "px"
                });

           
                if (
                    positionX < jablkoX + 20 &&
                    positionX + 200 > jablkoX &&
                    positionY < jablkoY + 20 &&
                    positionY + 200 > jablkoY
                ) {

             
                    jablkoX = Math.floor(Math.random() * 500);
                    jablkoY = Math.floor(Math.random() * 500);

                    $("#jablko").css({
                        "margin-left": jablkoX + "px",
                        "margin-top": jablkoY + "px"
                    });
                }

                console.log("Pozycje:", positionX, positionY);
            });

        });
    </script>
</head>
<style>
    #kwadrat{
        width: 200px;
        height: 200px;
        background-color: red;
        position: absolute;
    }

    #jablko{
                width: 20px;
        height: 20px;
        background-color: green;
    }
</style>
<body>

</body>
</html>
